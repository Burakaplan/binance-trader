// ─── Teknik Göstergeler ───────────────────────────────────────────────────────
function ema(a,p){if(a.length<p)return a[a.length-1]||0;const k=2/(p+1);let e=a.slice(0,p).reduce((x,y)=>x+y,0)/p;for(let i=p;i<a.length;i++)e=a[i]*k+e*(1-k);return e;}
function rsi(a,p=14){if(a.length<p+1)return 50;let g=0,l=0;for(let i=a.length-p;i<a.length;i++){const d=a[i]-a[i-1];d>0?g+=d:l+=Math.abs(d);}return 100-100/(1+g/(l||1e-9));}
function macd(a){const f=ema(a,12),s=ema(a,26),ln=f-s,sl=ema(a.slice(-9).map((_,i)=>ema(a.slice(0,a.length-8+i),12)-ema(a.slice(0,a.length-8+i),26)),9);return{line:ln,sig:sl,hist:ln-sl};}
function boll(a,p=20){if(a.length<p){const v=a[a.length-1]||0;return{u:v*1.02,m:v,l:v*.98,bw:2};}const sl=a.slice(-p),m=sl.reduce((x,y)=>x+y,0)/p,sd=Math.sqrt(sl.reduce((x,y)=>x+(y-m)**2,0)/p);return{u:m+2*sd,m,l:m-2*sd,bw:4*sd/m*100};}
function srsi(a,p=14){if(a.length<p*2)return{k:50};const rv=[];for(let i=p;i<=a.length;i++)rv.push(rsi(a.slice(i-p-1,i)));const rc=rv.slice(-p),mn=Math.min(...rc),mx=Math.max(...rc);return{k:Math.max(0,Math.min(100,mx===mn?50:(rv[rv.length-1]-mn)/(mx-mn)*100))};}
function cci(a,p=20){if(a.length<p)return 0;const sl=a.slice(-p),m=sl.reduce((x,y)=>x+y,0)/p,mad=sl.reduce((x,y)=>x+Math.abs(y-m),0)/p;return mad===0?0:(a[a.length-1]-m)/(0.015*mad);}
function atr(a,p=14){if(a.length<p+1)return(a[a.length-1]||1)*0.015;return a.slice(-p-1).map((v,i,arr)=>i===0?0:Math.abs(v-arr[i-1])).slice(1).reduce((x,y)=>x+y,0)/p;}

// ─── Piyasa Rejimi ────────────────────────────────────────────────────────────
function detectRegime(hist){
  if(hist.length<50)return{type:"unknown",label:"Bilinmiyor",color:"#6b7280",desc:""};
  const e20=ema(hist,20),e50=ema(hist.slice(-60),50);
  const price=hist[hist.length-1];
  const atr14=atr(hist,14);
  const atrPct=atr14/price*100;
  const slope20=((price-hist[hist.length-21])/hist[hist.length-21])*100;
  const bb20=boll(hist,20);
  if(bb20.bw<1.5)return{type:"squeeze",label:"SIKIŞMA",color:"#f59e0b",desc:"Büyük hareket yaklaşıyor — yön bekleniyor"};
  if(atrPct>3&&bb20.bw>6)return{type:"volatile",label:"VOLATİL",color:"#ef4444",desc:"Aşırı volatilite — stop-loss geniş tut"};
  if(e20>e50&&slope20>1)return{type:"bull",label:"YÜKSELİŞ",color:"#22c55e",desc:"Trend yukarı — AL sinyalleri güvenilir"};
  if(e20<e50&&slope20<-1)return{type:"bear",label:"DÜŞÜŞ",color:"#ef4444",desc:"Trend aşağı — SAT sinyalleri güvenilir"};
  return{type:"range",label:"YATAY",color:"#38bdf8",desc:"Yatay piyasa — RSI+BB stratejisi çalışır"};
}

// ─── Dinamik SL/TP ────────────────────────────────────────────────────────────
function dynLevels(price,hist,riskLevel){
  const at=atr(hist,14);
  const regime=detectRegime(hist);
  const mult={düşük:{sl:2.5,tp:4.0},orta:{sl:3.0,tp:5.5},yüksek:{sl:3.5,tp:8.0}}[riskLevel]||{sl:3.0,tp:5.5};
  const slM=regime.type==="volatile"?mult.sl*1.4:mult.sl;
  const tpM=regime.type==="bull"?mult.tp*1.2:regime.type==="bear"?mult.tp*0.8:mult.tp;
  return{sl:price*(1-slM*at/price),tp:price*(1+tpM*at/price),at,atPct:at/price*100,slPct:slM*at/price*100,tpPct:tpM*at/price*100,regime};
}

// ─── Multi-Timeframe ──────────────────────────────────────────────────────────
function mtfAnalysis(hist){
  if(hist.length<48)return{h1:"—",h4:"—",d1:"—",align:0,label:"Yetersiz veri"};
  const r1h=rsi(hist.slice(-15));
  const h4=hist.filter((_,i)=>i%4===0);
  const r4h=rsi(h4.slice(-15));
  const h1d=hist.filter((_,i)=>i%24===0);
  const r1d=h1d.length>5?rsi(h1d.slice(-10)):50;
  const d=(v)=>v>55?"AL":v<45?"SAT":"NÖTR";
  const dirs=[d(r1h),d(r4h),d(r1d)];
  const buy=dirs.filter(x=>x==="AL").length,sell=dirs.filter(x=>x==="SAT").length;
  const align=buy===3?3:sell===3?-3:buy===2?1:sell===2?-1:0;
  const label=align===3?"3/3 AL ✅":align===-3?"3/3 SAT 🔴":align===1?"2/3 AL":align===-1?"2/3 SAT":"Karışık";
  return{h1:d(r1h),h4:d(r4h),d1:d(r1d),r1h,r4h,r1d,align,label};
}

// ─── Ana Analiz ───────────────────────────────────────────────────────────────
function analyze(hist,price){
  if(hist.length<30)return{action:"BEKLE",conf:0,score:0,reasons:["Veri biriktiriliyyor ("+hist.length+"/30)"],strat:"Bekleniyor",regime:"—",ind:null,lead:null};
  const r=rsi(hist),m=macd(hist),b=boll(hist);
  const e9=ema(hist,9),e21=ema(hist,21),e50=ema(hist,50);
  const sr=srsi(hist),c=cci(hist);
  const slope=hist.length>6?(hist[hist.length-1]-hist[hist.length-7])/hist[hist.length-7]*100:0;
  const trending=Math.abs(slope)>.3||b.bw>2.5;

  // Hacim
  const vols=hist.slice(-10).map((v,i,a)=>i===0?0:Math.abs(v-a[i-1])/a[i-1]*100);
  const avgVol=vols.reduce((a,b)=>a+b,0)/vols.length||0.001;
  const lastVol=vols[vols.length-1]||0;
  const vSpike=lastVol/avgVol;
  const accum=vSpike>1.5&&slope>-0.2&&slope<1.0;
  const distrib=vSpike>1.5&&slope>-1.0&&slope<0.2;

  // RSI Divergence
  let bullDiv=false,bearDiv=false;
  if(hist.length>=30){
    const w=hist.slice(-20);
    const rv=w.map((_,i)=>rsi(hist.slice(0,hist.length-20+i+1)));
    const pl1=Math.min(...w.slice(0,10)),pl2=Math.min(...w.slice(10));
    const rl1=rv[w.slice(0,10).indexOf(pl1)]||50;
    const rl2=rv[10+w.slice(10).indexOf(pl2)]||50;
    if(pl2<pl1&&rl2>rl1+3)bullDiv=true;
    const ph1=Math.max(...w.slice(0,10)),ph2=Math.max(...w.slice(10));
    const rh1=rv[w.slice(0,10).indexOf(ph1)]||50;
    const rh2=rv[10+w.slice(10).indexOf(ph2)]||50;
    if(ph2>ph1&&rh2<rh1-3)bearDiv=true;
  }

  // Fibonacci
  const fw=hist.slice(-50);
  const fHi=Math.max(...fw),fLo=Math.min(...fw),fRng=fHi-fLo||1;
  const fibs=[fHi-0.236*fRng,fHi-0.382*fRng,fHi-0.5*fRng,fHi-0.618*fRng,fHi-0.786*fRng];
  const fibLbls=["%23.6","%38.2","%50.0","%61.8","%78.6"];
  const nearFib=fibs.reduce((best,f,i)=>{const d=Math.abs(price-f)/price*100;return d<best.d?{d,lbl:fibLbls[i],val:f,idx:i}:best;},{d:999,lbl:"",val:0,idx:-1});
  const atFibSup=nearFib.d<0.8&&nearFib.idx>=2;
  const atFibRes=nearFib.d<0.8&&nearFib.idx<2;

  let score=0,reasons=[],strat="";
  if(trending){
    strat="Trend Takip (EMA+MACD)";
    if(e9>e21&&e21>e50){score+=2;reasons.push("🔼 EMA9>21>50 yükseliş trendi");}
    else if(e9<e21&&e21<e50){score-=2;reasons.push("🔽 EMA9<21<50 düşüş trendi");}
    else if(e9>e21){score+=1;reasons.push("↗ EMA9>EMA21");}
    else{score-=1;reasons.push("↘ EMA9<EMA21");}
    if(m.hist>0){score+=2;reasons.push("⚡ MACD pozitif momentum");}
    else{score-=2;reasons.push("⚡ MACD negatif momentum");}
    if(r>50&&r<70){score+=1;reasons.push("RSI momentum ("+r.toFixed(0)+")");}
    else if(r<50&&r>30){score-=1;reasons.push("RSI zayıflama ("+r.toFixed(0)+")");}
  } else {
    strat="Ortalamaya Dönüş (RSI+BB)";
    if(r<32&&sr.k<25){score+=3;reasons.push("💚 Aşırı satım RSI:"+r.toFixed(0)+" StochRSI:"+sr.k.toFixed(0));}
    else if(r>68&&sr.k>75){score-=3;reasons.push("❤️ Aşırı alım RSI:"+r.toFixed(0)+" StochRSI:"+sr.k.toFixed(0));}
    else if(r<42){score+=1;reasons.push("RSI düşük ("+r.toFixed(0)+")");}
    else if(r>58){score-=1;reasons.push("RSI yüksek ("+r.toFixed(0)+")");}
    if(price<b.l*1.003){score+=2;reasons.push("📊 BB alt bant alım fırsatı");}
    else if(price>b.u*.997){score-=2;reasons.push("📊 BB üst bant satış baskısı");}
    if(c<-100){score+=1;reasons.push("CCI aşırı satım ("+c.toFixed(0)+")");}
    else if(c>100){score-=1;reasons.push("CCI aşırı alım ("+c.toFixed(0)+")");}
  }
  if(accum){score+=2;reasons.push("🔋 Birikim tespit edildi (×"+vSpike.toFixed(1)+")");}
  else if(distrib){score-=2;reasons.push("📤 Dağıtım tespit edildi (×"+vSpike.toFixed(1)+")");}
  if(bullDiv){score+=3;reasons.push("🔀 Bullish RSI Divergence — erken dönüş sinyali");}
  if(bearDiv){score-=3;reasons.push("🔀 Bearish RSI Divergence — erken düşüş sinyali");}
  if(atFibSup){score+=2;reasons.push("📐 Fibonacci destek: "+nearFib.lbl+" ($"+nearFib.val.toFixed(2)+")");}
  else if(atFibRes){score-=1;reasons.push("📐 Fibonacci direnç: "+nearFib.lbl);}
  if(slope>1.5){score+=1;reasons.push("🚀 Güçlü yukarı ivme +"+slope.toFixed(2)+"%");}
  else if(slope<-1.5){score-=1;reasons.push("🌊 Güçlü aşağı ivme "+slope.toFixed(2)+"%");}

  // Çoklu öncü sinyal onayı
  const leadingConfirm = bullDiv || accum || atFibSup;   // AL için öncü onay
  const leadingDeny    = bearDiv || distrib || atFibRes; // SAT için öncü onay
  const conf=Math.min(99,Math.round(Math.abs(score)*10+10));
  // AL: score yüksek VE en az 1 öncü sinyal onayı
  // SAT: score düşük VE en az 1 öncü sinyal onayı  
  let action="BEKLE";
  if(score>=6 && leadingConfirm)  action="AL";
  else if(score<=-6 && leadingDeny) action="SAT";
  else if(score>=8)  action="AL";   // çok güçlü sinyal — öncü onay olmasa da al
  else if(score<=-8) action="SAT";
  return{action,score,conf,reasons,strat,regime:trending?"TREND":"YATAY",
    ind:{r,m,b,e9,e21,e50,sr,c,slope,bw:b.bw},
    lead:{vSpike,accum,distrib,bullDiv,bearDiv,nearFib,atFibSup,atFibRes,fibs,fibLbls,fHi,fLo}};
}

// ─── Optimizasyon Tarayıcısı ─────────────────────────────────────────────────
function runOptimizer(hist){
  if(hist.length<60)return[];
  const results=[];
  // Farklı score eşiklerini test et
  const thresholds=[4,5,6,7,8];
  const slMults=[1.5,2.0,2.5,3.0,3.5];
  thresholds.forEach(thr=>{
    slMults.forEach(slM=>{
      const tpM=slM*1.8; // TP her zaman SL'nin 1.8 katı
      let bal=10000,pos=null,wins=0,losses=0,trades=0;
      for(let i=50;i<hist.length;i++){
        const slice=hist.slice(0,i),price=hist[i];
        const sig=analyze(slice,price);
        if(pos){
          const at=atr(slice,14);
          const sl=pos.entry*(1-slM*at/pos.entry);
          const tp=pos.entry*(1+tpM*at/pos.entry);
          if(price<=sl){const g=pos.qty*price-pos.inv;bal+=pos.qty*price;losses++;trades++;pos=null;}
          else if(price>=tp){const g=pos.qty*price-pos.inv;bal+=pos.qty*price;wins++;trades++;pos=null;}
        }
        if(!pos&&sig.action==="AL"&&sig.score>=thr&&bal>200){
          const inv=bal*0.07;
          pos={qty:inv/price,entry:price,inv};
          bal-=inv;
        }
      }
      if(pos){bal+=pos.qty*hist[hist.length-1];trades++;}
      const wr=trades>0?Math.round(wins/trades*100):0;
      const ret=((bal/10000)-1)*100;
      results.push({thr,slM:slM.toFixed(1),tpM:tpM.toFixed(1),wr,ret:ret.toFixed(1),trades,wins,losses});
    });
  });
  return results.sort((a,b)=>b.wr-a.wr).slice(0,10);
}

// ─── Backtesting ──────────────────────────────────────────────────────────────
function runBacktest(hist,riskLevel){
  if(hist.length<50)return null;
  const p={düşük:{pos:.04,sl:.015,tp:.04},orta:{pos:.07,sl:.025,tp:.07},yüksek:{pos:.12,sl:.04,tp:.12}}[riskLevel]||{pos:.07,sl:.025,tp:.07};
  let bal=10000,pos=null;
  const trades=[],equity=[10000];
  for(let i=50;i<hist.length;i++){
    const slice=hist.slice(0,i),price=hist[i];
    const sig=analyze(slice,price);
    if(pos){
      if(price<=pos.sl||price>=pos.tp){
        const gain=pos.qty*price-pos.inv;
        bal+=pos.qty*price;
        trades.push({action:"SAT",price,gain,reason:price<=pos.sl?"Stop-Loss":"Kâr Hedefi"});
        pos=null;
      }
    }
    if(!pos&&sig.action==="AL"&&sig.score>=6&&bal>200){
      const inv=bal*p.pos;
      const dl=dynLevels(price,slice,riskLevel);
      pos={qty:inv/price,entry:price,inv,sl:dl.sl,tp:dl.tp};
      bal-=inv;
      trades.push({action:"AL",price,inv});
    } else if(pos&&sig.action==="SAT"&&sig.score<=-4){
      const gain=pos.qty*price-pos.inv;
      bal+=pos.qty*price;
      trades.push({action:"SAT",price,gain,reason:"Sinyal"});
      pos=null;
    }
    equity.push(bal+(pos?pos.qty*price:0));
  }
  if(pos){const price=hist[hist.length-1];const gain=pos.qty*price-pos.inv;bal+=pos.qty*price;trades.push({action:"SAT",price,gain,reason:"Kapanış"});}
  const sells=trades.filter(t=>t.action==="SAT"&&t.gain!=null);
  const wins=sells.filter(t=>t.gain>0);
  const totalPnl=sells.reduce((s,t)=>s+(t.gain||0),0);
  const maxEq=Math.max(...equity);
  const maxDD=Math.min(...equity.map((v)=>((v-maxEq)/maxEq)*100));
  return{finalVal:bal,totalReturn:((bal/10000)-1)*100,winRate:sells.length?Math.round(wins.length/sells.length*100):0,
    totalPnl,tradeCount:sells.length,winCount:wins.length,lossCount:sells.length-wins.length,
    maxDrawdown:maxDD,equity:equity.slice(-200),trades:trades.slice(-12)};
}

// ─── UI Bileşenleri ───────────────────────────────────────────────────────────
function Spark({data,color,W=78,H=26}){
  if(!data||data.length<2)return <svg width={W} height={H}/>;
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||mn*.001;
  const pts=data.map((v,i)=>`${i/(data.length-1)*W},${H-((v-mn)/rng)*(H-3)-1}`).join(" ");
  const uid="s"+(color+W).split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  return <svg width={W} height={H}><defs><linearGradient id={uid} x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".2"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs><polygon points={`${pts} ${W},${H} 0,${H}`} fill={`url(#${uid})`}/><polyline points={pts} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round"/></svg>;
}

function Gauge({v,action}){
  const col=action==="AL"?"#22c55e":action==="SAT"?"#ef4444":"#6b7280";
  const r=28,circ=2*Math.PI*r,dash=v/100*circ;
  return <svg width={76} height={54}><circle cx={38} cy={38} r={r} fill="none" stroke="#1e293b" strokeWidth={7}/><circle cx={38} cy={38} r={r} fill="none" stroke={col} strokeWidth={5} strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" transform="rotate(-90 38 38)"/><text x={38} y={34} textAnchor="middle" fill={col} fontSize="14" fontWeight="bold">{v}%</text><text x={38} y={47} textAnchor="middle" fill="#475569" fontSize="8">GÜVEN</text></svg>;
}

function EqChart({data,W=440,H=80}){
  if(!data||data.length<2)return null;
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
  const pts=data.map((v,i)=>`${i/(data.length-1)*W},${H-((v-mn)/rng)*(H-4)-2}`).join(" ");
  const color=data[data.length-1]>=data[0]?"#22c55e":"#ef4444";
  const base=H-((10000-mn)/rng)*(H-4)-2;
  return <svg width={W} height={H} style={{display:"block"}}>
    <defs><linearGradient id="eq" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".15"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
    <line x1={0} y1={base} x2={W} y2={base} stroke="#1a2a5e" strokeWidth="1" strokeDasharray="4,4"/>
    <polygon points={`${pts} ${W},${H} 0,${H}`} fill="url(#eq)"/>
    <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/>
  </svg>;
}

const fp=v=>v>1000?v.toFixed(2):v>10?v.toFixed(3):v>1?v.toFixed(4):v.toFixed(6);
const AC={AL:"#22c55e",SAT:"#ef4444",BEKLE:"#6b7280"};
const Box=({children,s={}})=><div style={{background:"#080e24",border:"1px solid #1a2a5e",borderRadius:8,padding:10,...s}}>{children}</div>;
const Lbl=({t})=><div style={{fontSize:9,color:"#2a4070",marginBottom:6}}>{t}</div>;
const Row=({l,v,c})=><div style={{display:"flex",justifyContent:"space-between",marginBottom:5,fontSize:9}}><span style={{color:"#4a6fa5"}}>{l}</span><span style={{color:c||"#94a3b8",fontWeight:700}}>{v}</span></div>;
const StatCard=({l,v,c})=><div style={{background:"#080e24",border:"1px solid #1a2a5e",borderRadius:6,padding:"6px 8px"}}><div style={{fontSize:7,color:"#2a4070",marginBottom:2}}>{l}</div><div style={{fontSize:14,fontWeight:700,color:c}}>{v}</div></div>;
const MiniCard=({l,v,c})=><div style={{background:"#050d20",borderRadius:5,padding:"6px 8px"}}><div style={{fontSize:7,color:"#2a4070",marginBottom:2}}>{l}</div><div style={{fontWeight:700,color:c||"#94a3b8",fontSize:11}}>{v}</div></div>;

// ─── Proxy Kurulum ────────────────────────────────────────────────────────────
function Setup({onSave}){
  const [url,setUrl]=useState(localStorage.getItem("pxUrl")||"");
  const [test,setTest]=useState(null);
  const [testing,setTesting]=useState(false);
  function doTest(u){
    setTesting(true);setTest(null);
    const xhr=new XMLHttpRequest();xhr.timeout=10000;xhr.open("GET",u,true);
    xhr.onreadystatechange=()=>{
      if(xhr.readyState!==4)return;setTesting(false);
      if(xhr.status===200){try{const d=JSON.parse(xhr.responseText);d.bitcoin?setTest({ok:true,msg:"✅ Başarılı! BTC: $"+d.bitcoin?.usd?.toFixed(0)}):setTest({ok:false,msg:"⚠ Format hatası"});}catch(e){setTest({ok:false,msg:"⚠ Parse hatası"});}}
      else setTest({ok:false,msg:"❌ HTTP "+xhr.status});
    };
    xhr.ontimeout=()=>{setTesting(false);setTest({ok:false,msg:"❌ Timeout"});};
    xhr.onerror=()=>{setTesting(false);setTest({ok:false,msg:"❌ Bağlantı hatası"});};
    xhr.send();
  }
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#04081a"}}>
    <div style={{width:500,background:"#080e24",border:"1px solid #1a2a5e",borderRadius:12,padding:24}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <div style={{width:40,height:40,borderRadius:10,background:"#f0b90b",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:900,color:"#000"}}>₿</div>
        <div><div style={{fontSize:15,fontWeight:700,color:"#fff"}}>KRİPTO AI TRADER</div><div style={{fontSize:10,color:"#2a4070"}}>Vercel Proxy URL Girin</div></div>
      </div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:10,color:"#2a4070",marginBottom:6}}>PROXY URL</div>
        <div style={{display:"flex",gap:8}}>
          <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxx.vercel.app/api/prices" style={{flex:1,background:"#0a1535",border:"1px solid #1a2a5e",borderRadius:6,padding:"8px 12px",color:"#b0c4f8",fontSize:11,outline:"none"}}/>
          <button onClick={()=>doTest(url)} disabled={!url||testing} style={{padding:"8px 14px",background:"#0a1535",border:"1px solid #1a3060",borderRadius:6,color:"#38bdf8",fontSize:11,opacity:!url||testing?.6:1}}>{testing?"...":"Test Et"}</button>
        </div>
        {test&&<div style={{marginTop:8,fontSize:11,color:test.ok?"#22c55e":"#ef4444",padding:"6px 10px",background:test.ok?"#021008":"#120305",borderRadius:5}}>{test.msg}</div>}
      </div>
      <button onClick={()=>{if(url){localStorage.setItem("pxUrl",url);onSave(url);}}} disabled={!url} style={{width:"100%",padding:"11px",background:url?"#14532d":"#0a1228",border:`1px solid ${url?"#22c55e":"#1a2a5e"}`,borderRadius:8,color:url?"#22c55e":"#4a6fa5",fontWeight:700,fontSize:13,opacity:url?1:.6}}>
        ▶ BOTU BAŞLAT
      </button>
    </div>
  </div>;
}

// ─── Ana Uygulama ─────────────────────────────────────────────────────────────
function App(){
  const saved=localStorage.getItem("pxUrl");
  const [pxUrl,setPxUrl]=useState(saved||null);
  const [wsStatus,setWsStatus]=useState("connecting");
  const [statusMsg,setStatusMsg]=useState("Bağlanıyor...");
  const [histPct,setHistPct]=useState(0);
  const [prices,setPrices]=useState({});
  const [hists,setHists]=useState({});
  const [market,setMarket]=useState([]);
  const [sigs,setSigs]=useState({});
  const [tickCount,setTickCount]=useState(0);
  const [botOn,setBotOn]=useState(false);
  const [balance,setBalance]=useState(10000);
  const [portfolio,setPortfolio]=useState({});
  const [trades,setTrades]=useState([]);
  const [pnl,setPnl]=useState(0);
  const [stats,setStats]=useState({w:0,l:0,t:0});
  const [risk,setRisk]=useState("orta");
  const [focus,setFocus]=useState("BTCUSDT");
  const [logs,setLogs]=useState([]);
  const [lastUpd,setLastUpd]=useState(null);
  const [tab,setTab]=useState("analiz");
  const [btResult,setBtResult]=useState(null);
  const [optResult,setOptResult]=useState(null);
  const [optRunning,setOptRunning]=useState(false);
  const [btRunning,setBtRunning]=useState(false);

  const prR=useRef({}),hiR=useRef({});
  const balR=useRef(10000),portR=useRef({}),trR=useRef([]),stR=useRef({w:0,l:0,t:0});
  const botR=useRef(false),riskR=useRef("orta");
  botR.current=botOn; riskR.current=risk;

  const RP={düşük:{pos:.04,minC:72,maxP:2},orta:{pos:.07,minC:56,maxP:4},yüksek:{pos:.12,minC:45,maxP:6}};
  const log=useCallback((msg,type="info")=>setLogs(p=>[{msg,type,t:new Date().toLocaleTimeString("tr-TR")},...p].slice(0,120)),[]);

  function trade(pair,action,price,reason){
    const p=RP[riskR.current];
    if(action==="AL"&&balR.current>200&&!portR.current[pair]&&Object.keys(portR.current).length<p.maxP){
      const inv=balR.current*p.pos;
      const dl=dynLevels(price,hiR.current[pair]||[price],riskR.current);
      portR.current={...portR.current,[pair]:{qty:inv/price,entry:price,inv,sl:dl.sl,tp:dl.tp,atPct:dl.atPct}};
      balR.current-=inv;setPortfolio({...portR.current});setBalance(balR.current);
      trR.current=[{id:Date.now(),pair,action:"AL",price,inv,reason,t:new Date().toLocaleTimeString("tr-TR")},...trR.current].slice(0,300);
      setTrades([...trR.current]);
      log("AL "+pair.replace("USDT","")+" @ $"+fp(price)+" | $"+inv.toFixed(0)+" | ATR: "+dl.atPct.toFixed(2)+"%","buy");
    }
    if(action==="SAT"&&portR.current[pair]){
      const pos=portR.current[pair],rev=pos.qty*price,gain=rev-pos.inv;
      const np={...portR.current};delete np[pair];
      portR.current=np;balR.current+=rev;setPortfolio({...np});setBalance(balR.current);
      setPnl(x=>x+gain);stR.current={w:stR.current.w+(gain>0?1:0),l:stR.current.l+(gain<=0?1:0),t:stR.current.t+1};
      setStats({...stR.current});
      trR.current=[{id:Date.now(),pair,action:"SAT",price,gain,reason,t:new Date().toLocaleTimeString("tr-TR")},...trR.current].slice(0,300);
      setTrades([...trR.current]);
      log((gain>=0?"💰 KAR ":"🔴 ZARAR ")+pair.replace("USDT","")+" "+(gain>=0?"+":"")+"$"+gain.toFixed(2),gain>=0?"win":"loss");
    }
  }

  const throttleRef=useRef(null);
  function scheduleAnalysis(){
    if(throttleRef.current)return;
    throttleRef.current=setTimeout(()=>{throttleRef.current=null;runAnalysis();},1500);
  }

  function runAnalysis(){
    const nm=[];
    PAIRS.forEach(p=>{
      const pd=prR.current[p];if(!pd)return;
      const h=hiR.current[p]||[];
      const s=analyze(h,pd.price);
      nm.push({pair:p,...pd,...s,hlen:h.length});
    });
    nm.sort((a,b)=>{if(a.action!=="BEKLE"&&b.action==="BEKLE")return-1;if(b.action!=="BEKLE"&&a.action==="BEKLE")return 1;return b.conf-a.conf;});
    setSigs(Object.fromEntries(nm.map(d=>[d.pair,d])));
    setMarket(nm);
    setPrices({...prR.current});
    setHists(Object.fromEntries(Object.entries(hiR.current).map(([k,v])=>[k,v.slice(-500)])));
    setTickCount(c=>c+1);
    setLastUpd(new Date().toLocaleTimeString("tr-TR"));
    if(botR.current){
      Object.entries(portR.current).forEach(([pair,pos])=>{
        const cur=prR.current[pair]?.price;if(!cur)return;
        if(cur<=pos.sl)trade(pair,"SAT",cur,"⛔ Stop-Loss");
        else if(cur>=pos.tp)trade(pair,"SAT",cur,"🎯 Kâr hedefi");
      });
      const pr=RP[riskR.current];
      nm.filter(d=>d.action!=="BEKLE"&&d.conf>=pr.minC).forEach(opp=>{
        const cur=prR.current[opp.pair]?.price;if(!cur)return;
        if(opp.action==="AL"&&!portR.current[opp.pair])trade(opp.pair,"AL",cur,opp.strat);
        if(opp.action==="SAT"&&portR.current[opp.pair])trade(opp.pair,"SAT",cur,opp.strat);
      });
    }
  }

  // 7 günlük geçmiş — proxy
  useEffect(()=>{
    if(!pxUrl)return;
    let loaded=0;
    const base=pxUrl.replace("/api/prices","");
    log("📊 7 günlük geçmiş veri yükleniyor...","info");
    // Sıralı yükleme — rate limit aşmamak için her istek arasında 5 saniye bekle
    function loadNext(idx){
      if(idx>=COINS.length){
        runAnalysis();
        log("✅ 7G geçmiş tamam — "+loaded+" coin × 168 saatlik","info");
        return;
      }
      const coin=COINS[idx];
      const xhr=new XMLHttpRequest();xhr.timeout=15000;
      xhr.open("GET",base+"/api/prices?type=history&id="+coin.cg,true);
      xhr.onreadystatechange=()=>{
        if(xhr.readyState!==4)return;
        if(xhr.status===200){
          try{const d=JSON.parse(xhr.responseText);if(d.prices?.length){hiR.current[coin.pair]=d.prices;const last=d.prices[d.prices.length-1];if(!prR.current[coin.pair])prR.current[coin.pair]={price:last,chg:((last-d.prices[0])/d.prices[0])*100,high:Math.max(...d.prices.slice(-24)),low:Math.min(...d.prices.slice(-24))};loaded++;}}catch(_){}
          setHistPct(Math.round((idx+1)/COINS.length*100));
          if(idx===0)runAnalysis(); // ilk coin gelince analizi başlat
        } else if(xhr.status===429){
          log("⏳ Rate limit — 15s bekleniyor ("+coin.name+")","warn");
          setTimeout(()=>loadNext(idx),15000); // rate limit'te bekle, aynı coin'i tekrar dene
          return;
        }
        setTimeout(()=>loadNext(idx+1),2000); // sonraki coin için 2s bekle
      };
      xhr.ontimeout=()=>{setTimeout(()=>loadNext(idx+1),1000);};
      xhr.onerror=()=>{setTimeout(()=>loadNext(idx+1),1000);};
      xhr.send();
    }
    loadNext(0);
  },[pxUrl]);

  // Anlık fiyat — proxy polling
  useEffect(()=>{
    if(!pxUrl)return;
    let active=true,fails=0,firstOk=false,timer=null;
    function fetch_(){
      if(!active)return;
      const xhr=new XMLHttpRequest();xhr.timeout=12000;xhr.open("GET",pxUrl,true);
      xhr.onreadystatechange=()=>{
        if(xhr.readyState!==4||!active)return;
        if(xhr.status===200){
          try{
            const data=JSON.parse(xhr.responseText);let got=0;
            COINS.forEach(coin=>{
              const d=data[coin.cg];if(!d?.usd)return;
              const price=d.usd,prev=prR.current[coin.pair]||{};
              prR.current[coin.pair]={price,chg:d.usd_24h_change||0,high:d.usd_24h_high||Math.max(price,prev.high||price),low:d.usd_24h_low||Math.min(price,prev.low||price)};
              hiR.current[coin.pair]=[...(hiR.current[coin.pair]||[]),price].slice(-500);got++;
            });
            fails=0;
            if(!firstOk&&got>0){firstOk=true;setWsStatus("live");setStatusMsg("Proxy canlı — "+got+" coin | 10s");log("✅ Canlı veri aktif","info");}
            if(got>0)scheduleAnalysis();
          }catch(e){onFail("Parse");}
        }else if(xhr.status===429){onFail("Rate limit");clearInterval(timer);timer=setInterval(fetch_,30000);}
        else onFail("HTTP "+xhr.status);
      };
      xhr.ontimeout=()=>{if(active)onFail("Timeout");};
      xhr.onerror=()=>{if(active)onFail("Ağ hatası");};
      xhr.send();
    }
    function onFail(msg){fails++;if(fails<=3||fails%5===0){setWsStatus(firstOk?"warn":"error");setStatusMsg(msg+" ("+fails+")");log("⚠ "+msg,"warn");}}
    fetch_();timer=setInterval(fetch_,10000);
    return()=>{active=false;clearInterval(timer);if(throttleRef.current)clearTimeout(throttleRef.current);};
  },[pxUrl]);

  if(!pxUrl)return <Setup onSave={url=>{localStorage.setItem("pxUrl",url);setPxUrl(url);}}/>;

  const totalVal=balance+Object.entries(portfolio).reduce((s,[p,pos])=>s+pos.qty*(prices[p]?.price||pos.entry),0);
  const ret=((totalVal/10000)-1)*100;
  const wr=stats.t>0?Math.round(stats.w/stats.t*100):0;
  const fSig=sigs[focus]||{},fPrice=prices[focus]||{},fHist=hists[focus]||[],fPos=portfolio[focus];
  const stCol=wsStatus==="live"?"#22c55e":wsStatus==="warn"?"#f59e0b":"#ef4444";

  // Backtest runner
  function startBacktest(){
    const h=hists[focus];
    if(!h||h.length<50)return;
    setBtRunning(true);setBtResult(null);
    setTimeout(()=>{setBtResult(runBacktest(h,risk));setBtRunning(false);},100);
  }

  return <div style={{background:"#04081a",minHeight:"100vh",display:"flex",flexDirection:"column"}}>

    {/* Geçmiş yükleme banner */}
    {histPct>0&&histPct<100&&<div style={{background:"#0a1535",borderBottom:"1px solid #1a3060",padding:"7px 16px",display:"flex",alignItems:"center",gap:10}}>
      <div style={{width:11,height:11,border:"2px solid #38bdf8",borderTop:"2px solid transparent",borderRadius:"50%",animation:"spin 1s linear infinite",flexShrink:0}}/>
      <span style={{fontSize:10,color:"#38bdf8"}}>7 günlük geçmiş yükleniyor... ({histPct}%)</span>
      <div style={{flex:1,height:4,background:"#0f1a3a",borderRadius:2,overflow:"hidden"}}><div style={{width:histPct+"%",height:"100%",background:"#38bdf8",transition:"width .3s",borderRadius:2}}/></div>
    </div>}

    {/* Header */}
    <div style={{background:"#070c20",borderBottom:"1px solid #1a2a5e",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:36,height:36,borderRadius:8,background:"#f0b90b",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:900,color:"#000"}}>₿</div>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:"#fff",letterSpacing:2}}>KRİPTO AI TRADER</div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:2}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:stCol}} className={wsStatus==="live"?"blink":""}/>
            <span style={{fontSize:9,color:stCol,fontWeight:700}}>{statusMsg}</span>
            {lastUpd&&<span style={{fontSize:9,color:"#1a3060",marginLeft:4}}>| {lastUpd}</span>}
            <button onClick={()=>{localStorage.removeItem("pxUrl");setPxUrl(null);}} style={{marginLeft:6,fontSize:8,color:"#2a4070",background:"none",border:"1px solid #1a2a5e",borderRadius:3,padding:"1px 5px"}}>⚙</button>
          </div>
        </div>
      </div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"center"}}>
        {[["PORTFÖY","$"+totalVal.toFixed(2),ret>=0?"#22c55e":"#ef4444"],["BAKİYE","$"+balance.toFixed(2),"#38bdf8"],["GETİRİ",(ret>=0?"+":"")+ret.toFixed(2)+"%",ret>=0?"#22c55e":"#ef4444"],["WIN RATE",wr+"%",wr>=50?"#22c55e":"#f59e0b"],["İŞLEM",stats.t,"#94a3b8"]].map(([l,v,c])=>(
          <div key={l} style={{textAlign:"center"}}><div style={{fontSize:8,color:"#2a4070",letterSpacing:1}}>{l}</div><div style={{fontSize:14,fontWeight:700,color:c}}>{v}</div></div>
        ))}
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
        {["düşük","orta","yüksek"].map(r=>{const c={düşük:"#22c55e",orta:"#f59e0b",yüksek:"#ef4444"}[r];return <button key={r} onClick={()=>setRisk(r)} style={{padding:"5px 9px",background:risk===r?c+"22":"#0a1228",border:`1px solid ${risk===r?c:"#1e3a5f"}`,borderRadius:6,color:risk===r?c:"#4a6fa5",fontSize:9,fontWeight:700}}>{r.toUpperCase()}</button>;})}
        <button onClick={()=>{if(!botOn)log("🚀 Bot başlatıldı — Risk: "+risk.toUpperCase(),"info");else log("⏹ Bot durduruldu","warn");setBotOn(x=>!x);}} style={{padding:"8px 18px",background:botOn?"#7f1d1d":"#14532d",border:`1px solid ${botOn?"#ef4444":"#22c55e"}`,borderRadius:8,color:botOn?"#ef4444":"#22c55e",fontWeight:700,fontSize:12}}>
          {botOn?"⏹ DURDUR":"▶ BAŞLAT"}
        </button>
      </div>
    </div>

    {/* Ana panel */}
    <div style={{display:"grid",gridTemplateColumns:"250px 1fr 260px",flex:1,overflow:"hidden"}}>

      {/* Sol — parite listesi */}
      <div style={{borderRight:"1px solid #1a2a5e",padding:10,overflowY:"auto"}}>
        <div style={{fontSize:9,color:"#2a4070",letterSpacing:2,marginBottom:8}}>
          CANLI VERİ {tickCount>0&&<span style={{color:"#22c55e",marginLeft:6}}>● {tickCount}</span>}
        </div>
        {market.length===0
          ?<div style={{textAlign:"center",color:"#1a3060",padding:24}}><div style={{fontSize:28,marginBottom:8}}>⏳</div><div style={{color:stCol,fontSize:11}}>{statusMsg}</div></div>
          :market.map(d=>{
            const ac=AC[d.action]||"#6b7280",col=(d.chg||0)>=0?"#22c55e":"#ef4444",held=!!portfolio[d.pair];
            const h=(hists[d.pair]||[]).slice(-50);
            return <div key={d.pair} onClick={()=>{setFocus(d.pair);setTab("analiz");setBtResult(null);}}
              style={{background:focus===d.pair?"#0d1f42":held?"#052010":"#080e24",border:`1px solid ${focus===d.pair?"#2a5a9e":held?"#22c55e33":d.action!=="BEKLE"?ac+"33":"#1a2a4e"}`,borderRadius:8,padding:"8px 9px",marginBottom:4,cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <span style={{color:"#fff",fontWeight:700}}>{d.pair.replace("USDT","")}</span>
                  <span style={{color:"#2a4070",fontSize:9}}>/USD</span>
                  {held&&<span style={{fontSize:7,color:"#22c55e",marginLeft:2}}>●</span>}
                </div>
                <span style={{padding:"2px 7px",borderRadius:4,fontSize:9,fontWeight:700,background:ac+"18",color:ac,border:`1px solid ${ac}44`}}>{d.action}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginTop:5}}>
                <div><div style={{color:"#fff",fontWeight:700,fontSize:13}}>${d.price?fp(d.price):"—"}</div><div style={{color:col,fontSize:9}}>{((d.chg||0)>=0?"+":"")+((d.chg)||0).toFixed(2)}%</div></div>
                <Spark data={h} color={col}/>
                <div style={{textAlign:"right"}}><div style={{fontSize:8,color:"#2a4070"}}>GÜVEN</div><div style={{fontSize:13,fontWeight:700,color:ac}}>{d.conf||0}%</div></div>
              </div>
              {d.action!=="BEKLE"&&<div style={{marginTop:4,fontSize:9,color:"#2a5040",padding:"2px 6px",background:"#020c08",borderRadius:3,borderLeft:`2px solid ${ac}`}}>{d.strat}</div>}
            </div>;
          })}
      </div>

      {/* Orta — analiz / backtest / rejim */}
      <div style={{padding:14,overflowY:"auto"}}>

        {/* Sekmeler */}
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          {[["analiz","🔬 ANALİZ"],["backtest","📈 BACKTEST"],["rejim","🌡 REJİM + MTF"]].map(([t,lbl])=>(
            <button key={t} onClick={()=>{setTab(t);if(t==="backtest"&&!btResult)startBacktest();}} style={{padding:"5px 14px",borderRadius:6,fontSize:10,fontWeight:700,background:tab===t?"#0d1f42":"#080e24",border:`1px solid ${tab===t?"#2a5a9e":"#1a2a5e"}`,color:tab===t?"#fff":"#4a6fa5"}}>{lbl}</button>
          ))}
          {tab==="backtest"&&btResult&&<button onClick={startBacktest} style={{padding:"5px 10px",borderRadius:6,fontSize:9,background:"#0a1228",border:"1px solid #1a2a5e",color:"#4a6fa5",marginLeft:"auto"}}>🔄 Yenile</button>}
        </div>

        {/* BACKTEST sekmesi */}
        {tab==="backtest"&&(
          btRunning
            ?<div style={{textAlign:"center",paddingTop:60}}><div style={{width:32,height:32,border:"3px solid #38bdf8",borderTop:"3px solid transparent",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 16px"}}/><div style={{color:"#38bdf8",fontSize:12}}>7 günlük geçmiş üzerinde backtest çalışıyor...</div></div>
            :!btResult
              ?<div style={{textAlign:"center",paddingTop:60}}><div style={{fontSize:40,marginBottom:12}}>📈</div><button onClick={startBacktest} style={{padding:"10px 24px",background:"#14532d",border:"1px solid #22c55e",borderRadius:8,color:"#22c55e",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>▶ Backtest Başlat — {focus.replace("USDT","")}</button></div>
              :<div>

                <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:700,color:t.action==="AL"?"#22c55e":t.gain>=0?"#22c55e":"#ef4444",fontSize:11}}>{t.action==="AL"?"↑":"↓"} {t.pair.replace("USDT","")}</span><span style={{color:"#1a3060",fontSize:8}}>{t.t}</span></div>
                <div style={{display:"flex",justifyContent:"space-between",marginTop:1}}><span style={{color:"#4a6fa5",fontSize:9}}>${fp(t.price)}</span>{t.gain!=null&&<span style={{color:t.gain>=0?"#22c55e":"#ef4444",fontWeight:700,fontSize:9}}>{t.gain>=0?"+":""}${t.gain.toFixed(2)}</span>}</div>
                {t.reason&&<div style={{color:"#1a3060",fontSize:7,marginTop:1}}>{t.reason}</div>}
              </div>
            ))}
        </div>

        <div style={{fontSize:9,color:"#2a4070",letterSpacing:1}}>CANLI LOG</div>
        <div style={{background:"#020610",border:"1px solid #1a2a5e",borderRadius:8,padding:8,height:140,overflowY:"auto"}}>
          {logs.length===0?<div style={{color:"#1a3060",fontSize:9}}>Bekleniyor...</div>
          :logs.map((l,i)=><div key={i} style={{marginBottom:2,fontSize:9,color:l.type==="buy"?"#22c55e":l.type==="win"?"#4ade80":l.type==="loss"?"#ef4444":l.type==="warn"?"#f59e0b":"#2a4070"}}><span style={{color:"#1a3060"}}>[{l.t}]</span> {l.msg}</div>)}
        </div>

        <div style={{background:"#05080f",border:"1px solid #0f1a3a",borderRadius:6,padding:7,fontSize:8,color:"#1a3060",lineHeight:1.9}}>
          <span style={{color:"#22c55e"}}>✅ VERİ</span> Proxy → 10s güncelleme<br/>
          <span style={{color:"#38bdf8"}}>📊 7G</span> Saatlik geçmiş veri<br/>
          <span style={{color:"#f59e0b"}}>🛡 MOD</span> Simülasyon<br/>
          <span style={{color:"#94a3b8"}}>🤖 AI</span> Hacim+Diverg+Fib+ATR+MTF
        </div>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
