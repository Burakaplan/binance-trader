<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ── CoinGecko ID (proxy için) + CoinCap ID (WebSocket için) ──────────────────
const COINS=[
  {cg:"bitcoin",       cc:"bitcoin",       pair:"BTCUSDT", name:"Bitcoin"},
  {cg:"ethereum",      cc:"ethereum",      pair:"ETHUSDT", name:"Ethereum"},
  {cg:"binancecoin",   cc:"binance-coin",  pair:"BNBUSDT", name:"BNB"},
  {cg:"solana",        cc:"solana",        pair:"SOLUSDT", name:"Solana"},
  {cg:"ripple",        cc:"xrp",           pair:"XRPUSDT", name:"XRP"},
  {cg:"cardano",       cc:"cardano",       pair:"ADAUSDT", name:"Cardano"},
  {cg:"dogecoin",      cc:"dogecoin",      pair:"DOGEUSDT",name:"Dogecoin"},
  {cg:"avalanche-2",   cc:"avalanche",     pair:"AVAXUSDT",name:"Avalanche"},
  {cg:"matic-network", cc:"polygon",       pair:"MATICUSDT",name:"Polygon"},
  {cg:"chainlink",     cc:"chainlink",     pair:"LINKUSDT",name:"Chainlink"},
  {cg:"polkadot",      cc:"polkadot",      pair:"DOTUSDT", name:"Polkadot"},
  {cg:"litecoin",      cc:"litecoin",      pair:"LTCUSDT", name:"Litecoin"},
  {cg:"cosmos",        cc:"cosmos",        pair:"ATOMUSDT",name:"Cosmos"},
  {cg:"uniswap",       cc:"uniswap",       pair:"UNIUSDT", name:"Uniswap"},
];
const PAIRS=COINS.map(c=>c.pair);
const BY_CC=Object.fromEntries(COINS.map(c=>[c.cc,c]));
const BY_PAIR=Object.fromEntries(COINS.map(c=>[c.pair,c]));
const CG_IDS=COINS.map(c=>c.cg).join(",");
const CC_IDS=COINS.map(c=>c.cc).join(",");

// ── Göstergeler ───────────────────────────────────────────────────────────────
const ema=(a,p)=>{if(a.length<p)return a[a.length-1]||0;const k=2/(p+1);let e=a.slice(0,p).reduce((x,y)=>x+y,0)/p;for(let i=p;i<a.length;i++)e=a[i]*k+e*(1-k);return e;};
const rsi=(a,p=14)=>{if(a.length<p+1)return 50;let g=0,l=0;for(let i=a.length-p;i<a.length;i++){const d=a[i]-a[i-1];d>0?g+=d:l+=Math.abs(d);}return 100-100/(1+g/(l||1e-9));};
const macd=(a)=>{const f=ema(a,12),s=ema(a,26),ln=f-s,sl=ema(a.slice(-9).map((_,i)=>ema(a.slice(0,a.length-8+i),12)-ema(a.slice(0,a.length-8+i),26)),9);return{line:ln,sig:sl,hist:ln-sl};};
const boll=(a,p=20)=>{if(a.length<p){const v=a[a.length-1]||0;return{u:v*1.02,m:v,l:v*.98,bw:2};}const sl=a.slice(-p),m=sl.reduce((x,y)=>x+y,0)/p,sd=Math.sqrt(sl.reduce((x,y)=>x+(y-m)**2,0)/p);return{u:m+2*sd,m,l:m-2*sd,bw:4*sd/m*100};};
const srsi=(a,p=14)=>{if(a.length<p*2)return{k:50};const rv=[];for(let i=p;i<=a.length;i++)rv.push(rsi(a.slice(i-p-1,i)));const rc=rv.slice(-p),mn=Math.min(...rc),mx=Math.max(...rc);return{k:Math.max(0,Math.min(100,mx===mn?50:(rv[rv.length-1]-mn)/(mx-mn)*100))};};
const cci_=(a,p=20)=>{if(a.length<p)return 0;const sl=a.slice(-p),m=sl.reduce((x,y)=>x+y,0)/p,mad=sl.reduce((x,y)=>x+Math.abs(y-m),0)/p;return mad===0?0:(a[a.length-1]-m)/(0.015*mad);};

function analyze(hist,price){
  if(hist.length<30)return{action:"BEKLE",conf:0,score:0,reasons:["Veri biriktiriliyyor ("+hist.length+"/30)"],strat:"Bekleniyor",regime:"—",ind:null,leading:null};

  const r=rsi(hist),m=macd(hist),b=boll(hist),e9=ema(hist,9),e21=ema(hist,21),e50=ema(hist,50),sr=srsi(hist),c=cci_(hist);
  const slope=hist.length>6?(hist[hist.length-1]-hist[hist.length-7])/hist[hist.length-7]*100:0;
  const trending=Math.abs(slope)>.3||b.bw>2.5;

  // ── 1. HACİM ANALİZİ (simüle — fiyat değişim hızından türetilir) ──────────
  // Gerçek hacim verisi olmadığından fiyat ivmesi × volatilite ile tahmin edilir
  const recentVols=hist.slice(-10).map((v,i,a)=>i===0?0:Math.abs(v-a[i-1])/a[i-1]*100);
  const avgVol=recentVols.reduce((a,b)=>a+b,0)/recentVols.length||0.001;
  const lastVol=recentVols[recentVols.length-1]||0;
  const volSpike=lastVol/avgVol; // >2 = hacim patlaması
  const priceDir=hist[hist.length-1]>hist[hist.length-3]?"up":"down";
  // Birikim: hacim artarken fiyat yatay veya hafif yukarı
  const accumulation=volSpike>1.5&&slope>-0.2&&slope<1.0;
  // Dağıtım: hacim artarken fiyat yatay veya hafif aşağı
  const distribution=volSpike>1.5&&slope>-1.0&&slope<0.2;

  // ── 2. RSI DIVERGENCE ────────────────────────────────────────────────────
  let bullDiv=false,bearDiv=false;
  if(hist.length>=30){
    // Son 20 mumda fiyat ve RSI zirvelerini/diplerini karşılaştır
    const window=hist.slice(-20);
    const rsiWindow=window.map((_,i)=>rsi(hist.slice(0,hist.length-20+i+1)));
    // Fiyat yeni dip, RSI daha yüksek dip → bullish divergence
    const priceLow1=Math.min(...window.slice(0,10)),priceLow2=Math.min(...window.slice(10));
    const rsiAtLow1=rsiWindow[window.slice(0,10).indexOf(priceLow1)];
    const rsiAtLow2=rsiWindow[10+window.slice(10).indexOf(priceLow2)];
    if(priceLow2<priceLow1&&rsiAtLow2>rsiAtLow1+3) bullDiv=true;
    // Fiyat yeni zirve, RSI daha düşük zirve → bearish divergence
    const priceHigh1=Math.max(...window.slice(0,10)),priceHigh2=Math.max(...window.slice(10));
    const rsiAtHigh1=rsiWindow[window.slice(0,10).indexOf(priceHigh1)];
    const rsiAtHigh2=rsiWindow[10+window.slice(10).indexOf(priceHigh2)];
    if(priceHigh2>priceHigh1&&rsiAtHigh2<rsiAtHigh1-3) bearDiv=true;
  }

  // ── 3. FİBONACCİ SEVİYELERİ ─────────────────────────────────────────────
  const fibWindow=hist.slice(-50);
  const fibHigh=Math.max(...fibWindow),fibLow=Math.min(...fibWindow);
  const fibRange=fibHigh-fibLow||1;
  const fib236=fibHigh-0.236*fibRange;
  const fib382=fibHigh-0.382*fibRange;
  const fib500=fibHigh-0.500*fibRange;
  const fib618=fibHigh-0.618*fibRange;
  const fib786=fibHigh-0.786*fibRange;
  const fibs=[fib236,fib382,fib500,fib618,fib786];
  const fibLabels=["Fib %23.6","Fib %38.2","Fib %50.0","Fib %61.8","Fib %78.6"];
  // Fiyat hangi Fibonacci seviyesine yakın? (±%0.8 tolerans)
  const nearFib=fibs.reduce((best,f,i)=>{const d=Math.abs(price-f)/price*100;return d<best.d?{d,label:fibLabels[i],val:f,idx:i}:best;},{d:999,label:"",val:0,idx:-1});
  const atFibSupport=nearFib.d<0.8&&nearFib.idx>=2; // %50 altı = destek
  const atFibResistance=nearFib.d<0.8&&nearFib.idx<2; // %23.6-38.2 = direnç

  // ── SKOR HESAPLA ─────────────────────────────────────────────────────────
  let score=0,reasons=[],strat="";

  // Gecikmeli indikatörler (mevcut)
  if(trending){
    strat="Trend Takip (EMA+MACD)";
    if(e9>e21&&e21>e50){score+=2;reasons.push("🔼 EMA9>21>50 yükseliş trendi");}
    else if(e9<e21&&e21<e50){score-=2;reasons.push("🔽 EMA9<21<50 düşüş trendi");}
    else if(e9>e21){score+=1;reasons.push("↗ EMA9>EMA21");}
    else{score-=1;reasons.push("↘ EMA9<EMA21");}
    if(m.hist>0){score+=2;reasons.push("⚡ MACD pozitif momentum");}
    else{score-=2;reasons.push("⚡ MACD negatif momentum");}
    if(r>50&&r<70){score+=1;reasons.push("📈 RSI momentum ("+r.toFixed(0)+")");}
    else if(r<50&&r>30){score-=1;reasons.push("📉 RSI zayıflama ("+r.toFixed(0)+")");}
  } else {
    strat="Ortalamaya Dönüş (RSI+BB)";
    if(r<32&&sr.k<25){score+=3;reasons.push("💚 Aşırı satım RSI:"+r.toFixed(0)+" StochRSI:"+sr.k.toFixed(0));}
    else if(r>68&&sr.k>75){score-=3;reasons.push("❤️ Aşırı alım RSI:"+r.toFixed(0)+" StochRSI:"+sr.k.toFixed(0));}
    else if(r<42){score+=1;reasons.push("RSI düşük ("+r.toFixed(0)+")");}
    else if(r>58){score-=1;reasons.push("RSI yüksek ("+r.toFixed(0)+")");}
    if(price<b.l*1.003){score+=2;reasons.push("📊 BB alt bant alım fırsatı");}
    else if(price>b.u*.997){score-=2;reasons.push("📊 BB üst bant satış baskısı");}
    if(c<-100){score+=1;reasons.push("CCI aşırı satım ("+c.toFixed(0)+")");}
    else if(c>100){score-=1;reasons.push("CCI aşırı alım ("+c.toFixed(0)+")");}
  }

  // ── ÖNİCÜ SİNYALLER (ek puan) ────────────────────────────────────────────

  // Hacim analizi
  if(accumulation){
    score+=2;
    reasons.push("🔋 Birikim tespit edildi (hacim spike: ×"+volSpike.toFixed(1)+")");
  } else if(distribution){
    score-=2;
    reasons.push("📤 Dağıtım tespit edildi (hacim spike: ×"+volSpike.toFixed(1)+")");
  } else if(volSpike>2&&priceDir==="up"){
    score+=1;reasons.push("📈 Güçlü alım hacmi (×"+volSpike.toFixed(1)+")");
  } else if(volSpike>2&&priceDir==="down"){
    score-=1;reasons.push("📉 Güçlü satış hacmi (×"+volSpike.toFixed(1)+")");
  }

  // RSI Divergence
  if(bullDiv){
    score+=3;
    reasons.push("🔀 Bullish RSI Divergence — fiyat dip ama RSI toparlanıyor");
  }
  if(bearDiv){
    score-=3;
    reasons.push("🔀 Bearish RSI Divergence — fiyat zirve ama RSI zayıflıyor");
  }

  // Fibonacci
  if(atFibSupport){
    score+=2;
    reasons.push("📐 Fibonacci destek: "+nearFib.label+" ($"+nearFib.val.toFixed(2)+")");
  } else if(atFibResistance){
    score-=1;
    reasons.push("📐 Fibonacci direnç: "+nearFib.label+" ($"+nearFib.val.toFixed(2)+")");
  }

  // EMA ivme / slope
  if(slope>1.5){score+=1;reasons.push("🚀 Güçlü yukarı ivme +"+slope.toFixed(2)+"%");}
  else if(slope<-1.5){score-=1;reasons.push("🌊 Güçlü aşağı ivme "+slope.toFixed(2)+"%");}

  const conf=Math.min(99,Math.round(Math.abs(score)*10+10));
  const action=score>=4?"AL":score<=-4?"SAT":"BEKLE";

  return{
    action,score,conf,reasons,strat,regime:trending?"TREND":"YATAY",
    ind:{r,m,b,e9,e21,e50,sr,c,slope,bw:b.bw},
    leading:{volSpike,accumulation,distribution,bullDiv,bearDiv,nearFib,atFibSupport,atFibResistance,fibs,fibLabels,fibHigh,fibLow}
  };
}
function Spark({data,color,W=78,H=26}){
  if(!data||data.length<2)return<svg width={W} height={H}/>;
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||mn*.001;
  const pts=data.map((v,i)=>`${i/(data.length-1)*W},${H-((v-mn)/rng)*(H-3)-1}`).join(" ");
  const uid="s"+(color+W).split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  return<svg width={W} height={H}><defs><linearGradient id={uid} x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".2"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs><polygon points={`${pts} ${W},${H} 0,${H}`} fill={`url(#${uid})`}/><polyline points={pts} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round"/></svg>;
}
function Gauge({v,action}){
  const col=action==="AL"?"#22c55e":action==="SAT"?"#ef4444":"#6b7280";
  const r=28,circ=2*Math.PI*r,dash=v/100*circ;
  return<svg width={76} height={54}><circle cx={38} cy={38} r={r} fill="none" stroke="#1e293b" strokeWidth={7}/><circle cx={38} cy={38} r={r} fill="none" stroke={col} strokeWidth={5} strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" transform="rotate(-90 38 38)"/><text x={38} y={34} textAnchor="middle" fill={col} fontSize="14" fontWeight="bold">{v}%</text><text x={38} y={47} textAnchor="middle" fill="#475569" fontSize="8">GÜVEN</text></svg>;
}
const fp=v=>v>1000?v.toFixed(2):v>10?v.toFixed(3):v>1?v.toFixed(4):v.toFixed(6);
const AC={AL:"#22c55e",SAT:"#ef4444",BEKLE:"#6b7280"};

// ── Proxy Kurulum Ekranı ──────────────────────────────────────────────────────
function SetupScreen({onSave}){
  const [url,setUrl]=useState(localStorage.getItem("proxyUrl")||"");
  const [testing,setTesting]=useState(false);
  const [testResult,setTestResult]=useState(null);
  function testUrl(u){
    setTesting(true);setTestResult(null);
    const xhr=new XMLHttpRequest();xhr.timeout=10000;xhr.open("GET",u,true);
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4)return;setTesting(false);
      if(xhr.status===200){try{const d=JSON.parse(xhr.responseText);if(d.bitcoin){setTestResult({ok:true,msg:"✅ Başarılı! Bitcoin: $"+d.bitcoin?.usd?.toFixed(0)});}else{setTestResult({ok:false,msg:"⚠️ Format beklenmedik"});}}catch(e){setTestResult({ok:false,msg:"⚠️ Parse hatası"});}}
      else{setTestResult({ok:false,msg:"❌ HTTP "+xhr.status});}
    };
    xhr.ontimeout=()=>{setTesting(false);setTestResult({ok:false,msg:"❌ Timeout"});};
    xhr.onerror=()=>{setTesting(false);setTestResult({ok:false,msg:"❌ Bağlantı hatası"});};
    xhr.send();
  }
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#04081a"}}>
      <div style={{width:520,background:"#080e24",border:"1px solid #1a2a5e",borderRadius:12,padding:24}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
          <div style={{width:40,height:40,borderRadius:10,background:"#f0b90b",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:900,color:"#000"}}>₿</div>
          <div><div style={{fontSize:15,fontWeight:700,color:"#fff"}}>KRİPTO AI TRADER</div><div style={{fontSize:10,color:"#2a4070"}}>Vercel Proxy URL — 7 Günlük Geçmiş Veri</div></div>
        </div>
        <div style={{background:"#0a1535",border:"1px solid #1a3060",borderRadius:8,padding:10,marginBottom:14,fontSize:11,color:"#6a8ab0",lineHeight:1.7}}>
          Proxy hem 7 günlük geçmiş veri hem de her 10 saniyede bir anlık fiyat güncellemesi için kullanılıyor. <span style={{color:"#22c55e"}}>Türkiye'den sorunsuz çalışır.</span>
        </div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,color:"#2a4070",marginBottom:6}}>PROXY URL</div>
          <div style={{display:"flex",gap:8}}>
            <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxx.vercel.app/api/prices" style={{flex:1,background:"#0a1535",border:"1px solid #1a2a5e",borderRadius:6,padding:"8px 12px",color:"#b0c4f8",fontSize:11,outline:"none"}}/>
            <button onClick={()=>testUrl(url)} disabled={!url||testing} style={{padding:"8px 14px",background:"#0a1535",border:"1px solid #1a3060",borderRadius:6,color:"#38bdf8",fontSize:11,opacity:!url||testing?.6:1}}>{testing?"Test...":"Test Et"}</button>
          </div>
          {testResult&&<div style={{marginTop:8,fontSize:11,color:testResult.ok?"#22c55e":"#ef4444",padding:"6px 10px",background:testResult.ok?"#021008":"#120305",borderRadius:5}}>{testResult.msg}</div>}
        </div>
        <button onClick={()=>{if(url){localStorage.setItem("proxyUrl",url);onSave(url);}}} disabled={!url} style={{width:"100%",padding:"11px",background:url?"#14532d":"#0a1228",border:`1px solid ${url?"#22c55e":"#1a2a5e"}`,borderRadius:8,color:url?"#22c55e":"#4a6fa5",fontWeight:700,fontSize:13,opacity:url?1:.6}}>
          ▶ BOTU BAŞLAT
        </button>
      </div>
    </div>
  );
}

// ── Ana Uygulama ──────────────────────────────────────────────────────────────
function App(){
  const saved=localStorage.getItem("proxyUrl");
  const [proxyUrl,setProxyUrl]=useState(saved||null);
  const [proxyStatus,setProxyStatus]=useState("—");   // 7G geçmiş durumu
  const [wsStatus,setWsStatus]=useState("connecting"); // WebSocket durumu
  const [statusMsg,setStatusMsg]=useState("Bağlanıyor...");
  const [histProgress,setHistProgress]=useState(0);
  const [prices,setPrices]=useState({});
  const [hists,setHists]=useState({});
  const [market,setMarket]=useState([]);
  const [sigs,setSigs]=useState({});
  const [tickCount,setTickCount]=useState(0);
  const [pps,setPps]=useState(0);
  const [botOn,setBotOn]=useState(false);
  const [balance,setBalance]=useState(10000);
  const [portfolio,setPortfolio]=useState({});
  const [trades,setTrades]=useState([]);
  const [pnl,setPnl]=useState(0);
  const [stats,setStats]=useState({w:0,l:0,t:0});
  const [risk,setRisk]=useState("orta");
  const [focus,setFocus]=useState("BTCUSDT");
  const [logs,setLogs]=useState([]);
  const [lastUpd,setLastUpd]=useState(null);

  const prR=useRef({}),hiR=useRef({});
  const balR=useRef(10000),portR=useRef({}),trR=useRef([]),stR=useRef({w:0,l:0,t:0});
  const botR=useRef(false),riskR=useRef("orta");
  const ppsCountR=useRef(0);
  botR.current=botOn; riskR.current=risk;

  const RP={
    düşük:{pos:.04,sl:.012,tp:.035,minC:72,maxP:2},
    orta: {pos:.07,sl:.022,tp:.065,minC:56,maxP:4},
    yüksek:{pos:.12,sl:.04, tp:.11, minC:45,maxP:6}
  };

  const log=useCallback((msg,type="info")=>setLogs(p=>[{msg,type,t:new Date().toLocaleTimeString("tr-TR")},...p].slice(0,150)),[]);

  function trade(pair,action,price,reason){
    const p=RP[riskR.current];
    if(action==="AL"&&balR.current>200&&!portR.current[pair]&&Object.keys(portR.current).length<p.maxP){
      const inv=balR.current*p.pos;
      portR.current={...portR.current,[pair]:{qty:inv/price,entry:price,inv,sl:price*(1-p.sl),tp:price*(1+p.tp)}};
      balR.current-=inv;setPortfolio({...portR.current});setBalance(balR.current);
      trR.current=[{id:Date.now(),pair,action:"AL",price,inv,reason,t:new Date().toLocaleTimeString("tr-TR")},...trR.current].slice(0,300);
      setTrades([...trR.current]);
      log("AL "+pair.replace("USDT","")+" @ $"+fp(price)+" | $"+inv.toFixed(0)+" yatırım","buy");
    }
    if(action==="SAT"&&portR.current[pair]){
      const pos=portR.current[pair],rev=pos.qty*price,gain=rev-pos.inv;
      const np={...portR.current};delete np[pair];
      portR.current=np;balR.current+=rev;setPortfolio({...np});setBalance(balR.current);
      setPnl(x=>x+gain);stR.current={w:stR.current.w+(gain>0?1:0),l:stR.current.l+(gain<=0?1:0),t:stR.current.t+1};
      setStats({...stR.current});
      trR.current=[{id:Date.now(),pair,action:"SAT",price,gain,reason,t:new Date().toLocaleTimeString("tr-TR")},...trR.current].slice(0,300);
      setTrades([...trR.current]);
      log((gain>=0?"💰 KAR ":"🔴 ZARAR ")+pair.replace("USDT","")+" "+(gain>=0?"+":"")+"$"+gain.toFixed(2),gain>=0?"win":"loss");
    }
  }

  // Throttled analiz — saniyede max 1
  const throttleRef=useRef(null);
  function scheduleAnalysis(){
    if(throttleRef.current)return;
    throttleRef.current=setTimeout(()=>{
      throttleRef.current=null;
      runAnalysis();
    },1000);
  }

  function runAnalysis(){
    const nm=[];
    PAIRS.forEach(p=>{
      const pd=prR.current[p];if(!pd)return;
      const h=hiR.current[p]||[];
      const s=analyze(h,pd.price);
      nm.push({pair:p,...pd,...s,hlen:h.length});
    });

                <div style={{background:"#050d20",borderRadius:6,padding:"8px 10px"}}>
                  <div style={{fontSize:8,color:"#2a4070",marginBottom:4}}>📐 FİBONACCİ</div>
                  <div style={{fontSize:11,fontWeight:700,color:L.atFibSupport?"#22c55e":L.atFibResistance?"#ef4444":"#94a3b8"}}>
                    {L.atFibSupport?"DESTEK ✓":L.atFibResistance?"DİRENÇ ✗":"—"}
                  </div>
                  <div style={{fontSize:9,color:"#f59e0b",marginTop:2,fontWeight:700}}>{L.nearFib.label}</div>
                  <div style={{fontSize:8,color:"#2a4070"}}>±{L.nearFib.d.toFixed(2)}% uzaklık</div>
                </div>
              </div>
              {/* Fibonacci seviyeleri */}
              <div style={{background:"#050d20",borderRadius:6,padding:"8px 10px"}}>
                <div style={{fontSize:8,color:"#2a4070",marginBottom:6}}>FİBONACCİ SEVİYELERİ (50 mum)</div>
                <div style={{display:"flex",flexDirection:"column",gap:3}}>
                  {L.fibs.map((f,i)=>{
                    const pct=Math.abs(fPrice.price-f)/fPrice.price*100;
                    const isNear=pct<0.8;
                    const isAbove=fPrice.price>f;
                    return<div key={i} style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:9,color:"#4a6fa5",width:60}}>{L.fibLabels[i]}</span>
                      <div style={{flex:1,height:3,background:"#0a1535",borderRadius:2,position:"relative"}}>
                        <div style={{position:"absolute",left:0,width:"100%",height:"100%",background:isNear?"#f59e0b22":"transparent",borderRadius:2}}/>
                        {isNear&&<div style={{position:"absolute",left:"50%",transform:"translateX(-50%)",width:6,height:6,borderRadius:"50%",background:"#f59e0b",top:-1.5}}/>}
                      </div>
                      <span style={{fontSize:9,color:isNear?"#f59e0b":isAbove?"#22c55e44":"#ef444444",fontWeight:isNear?700:400,width:70,textAlign:"right"}}>${f>100?f.toFixed(2):f.toFixed(4)}</span>
                      {isNear&&<span style={{fontSize:7,color:"#f59e0b"}}>← ŞİMDİ</span>}
                    </div>;
                  })}
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:8,color:"#1a3060",marginTop:6}}>
                  <span>Dip: ${L.fibLow>100?L.fibLow.toFixed(2):L.fibLow.toFixed(4)}</span>
                  <span>Zirve: ${L.fibHigh>100?L.fibHigh.toFixed(2):L.fibHigh.toFixed(4)}</span>
                </div>
              </div>
            </Box>;
          })()}

          {fSig.reasons?.length>0&&<Box><Lbl c="SİNYAL GEREKÇELERİ"/>{fSig.reasons.map((r,i)=><div key={i} style={{fontSize:11,padding:"4px 8px",background:"#050d20",borderRadius:4,marginBottom:4,borderLeft:`2px solid ${AC[fSig.action]||"#2a4070"}`,color:"#94a3b8"}}>{r}</div>)}</Box>}
        </div>
      ):<div style={{textAlign:"center",color:"#1a3060",paddingTop:60}}><div style={{fontSize:40,marginBottom:10}}>⚡</div><div style={{color:wsCol,fontSize:11}}>{wsStatus==="live"?"Sol panelden bir parite seçin":"Proxy bağlantısı kuruluyor..."}</div></div>}
    </div>

    {/* SAĞ */}
    <div style={{borderLeft:"1px solid #1a2a5e",padding:12,display:"flex",flexDirection:"column",gap:8,overflowY:"auto"}}>
      <div style={{fontSize:9,color:"#2a4070",letterSpacing:2}}>📊 PERFORMANS</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
        {[["Kâr/Zarar",(pnl>=0?"+":"")+"$"+pnl.toFixed(2),pnl>=0?"#22c55e":"#ef4444"],["Win Rate",wr+"%",wr>=50?"#22c55e":"#f59e0b"],["Kazanan",stats.w,"#22c55e"],["Kaybeden",stats.l,"#ef4444"],["Açık Poz.",Object.keys(portfolio).length,"#f59e0b"],["Toplam",stats.t,"#94a3b8"]].map(([l,v,c])=>(
          <div key={l} style={{background:"#080e24",border:"1px solid #1a2a5e",borderRadius:6,padding:"6px 8px"}}><div style={{fontSize:7,color:"#2a4070",marginBottom:2}}>{l}</div><div style={{fontSize:14,fontWeight:700,color:c}}>{v}</div></div>
        ))}
      </div>
      {Object.keys(portfolio).length>0&&<><div style={{fontSize:9,color:"#2a4070",letterSpacing:1}}>AKTİF POZİSYONLAR</div>{Object.entries(portfolio).map(([pair,pos])=>{const cur=prices[pair]?.price||pos.entry,upnl=pos.qty*cur-pos.inv;return<div key={pair} onClick={()=>setFocus(pair)} style={{background:upnl>=0?"#021008":"#120305",border:`1px solid ${upnl>=0?"#22c55e44":"#ef444444"}`,borderRadius:6,padding:"6px 8px",cursor:"pointer"}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:700,color:"#fff",fontSize:11}}>{pair.replace("USDT","")}</span><span style={{color:upnl>=0?"#22c55e":"#ef4444",fontWeight:700,fontSize:11}}>{upnl>=0?"+":""}${upnl.toFixed(2)}</span></div><div style={{display:"flex",justifyContent:"space-between",fontSize:8,color:"#2a4070",marginTop:2}}><span>SL: ${fp(pos.sl)}</span><span>TP: ${fp(pos.tp)}</span></div></div>;})}</>}
      <div style={{fontSize:9,color:"#2a4070",letterSpacing:1}}>SON İŞLEMLER</div>
      <div style={{flex:1,overflowY:"auto",minHeight:60}}>
        {trades.length===0?<div style={{color:"#1a3060",textAlign:"center",padding:12,fontSize:10}}>Bot başladığında işlemler görünecek</div>
        :trades.slice(0,50).map(t=><div key={t.id} style={{background:t.action==="AL"?"#020c08":t.gain>=0?"#020c08":"#0c0205",borderLeft:`3px solid ${t.action==="AL"?"#22c55e":t.gain>=0?"#22c55e":"#ef4444"}`,borderRadius:4,padding:"5px 7px",marginBottom:3}}>
          <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:700,color:t.action==="AL"?"#22c55e":t.gain>=0?"#22c55e":"#ef4444",fontSize:11}}>{t.action==="AL"?"↑":"↓"} {t.pair.replace("USDT","")}</span><span style={{color:"#1a3060",fontSize:8}}>{t.t}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:1}}><span style={{color:"#4a6fa5",fontSize:9}}>${fp(t.price)}</span>{t.gain!=null&&<span style={{color:t.gain>=0?"#22c55e":"#ef4444",fontWeight:700,fontSize:9}}>{t.gain>=0?"+":""}${t.gain.toFixed(2)}</span>}</div>
          {t.reason&&<div style={{color:"#1a3060",fontSize:7,marginTop:1}}>{t.reason}</div>}
        </div>)}
      </div>
      <div style={{fontSize:9,color:"#2a4070",letterSpacing:1}}>CANLI LOG</div>
      <div style={{background:"#020610",border:"1px solid #1a2a5e",borderRadius:8,padding:8,height:150,overflowY:"auto"}}>
        {logs.length===0?<div style={{color:"#1a3060",fontSize:9}}>Bekleniyor...</div>
        :logs.map((l,i)=><div key={i} style={{marginBottom:2,fontSize:9,color:l.type==="buy"?"#22c55e":l.type==="win"?"#4ade80":l.type==="loss"?"#ef4444":l.type==="warn"?"#f59e0b":"#2a4070"}}><span style={{color:"#1a3060"}}>[{l.t}]</span> {l.msg}</div>)}
      </div>
      <div style={{background:"#05080f",border:"1px solid #0f1a3a",borderRadius:6,padding:7,fontSize:8,color:"#1a3060",lineHeight:1.9}}>
        <span style={{color:"#22c55e"}}>✅ CANLI</span> Proxy polling (10s)<br/>
        <span style={{color:"#38bdf8"}}>📊 GEÇMİŞ</span> Proxy → 7G saatlik<br/>
        <span style={{color:"#f59e0b"}}>🛡 MOD</span> Simülasyon — gerçek para yok<br/>
        <span style={{color:"#94a3b8"}}>🤖 AI</span> 10 gösterge · Hacim+Diverg+Fib
      </div>
    </div>
  </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
